<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética para MMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h1>Gere cores aleatórias para uma estética!</h1>
        <button id="generate-btn">
            <i class="fas fa-sync-alt"></i>
            Gerar Cores
        </button>

        <div class="pallete-container">
            <!--COLOR BOX 1-->
            <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <i class="fa fa-copy copy-btn" title="Copiar cor!"></i>
                </div>
            </div>
        

            <!--COLOR BOX 2-->
            <div class="color-box">
                <div class="color" style="background-color: #ff80ee;"></div>
                <div class="color-info">
                    <span class="hex-value">#ff80ee</span>
                    <i class="fa fa-copy copy-btn" title="Copiar cor!"></i>
                </div>
            </div>

            <!--COLOR BOX 3-->
            <div class="color-box">
                <div class="color" style="background-color: #5bc580;"></div>
                <div class="color-info">
                    <span class="hex-value">#5bc580</span>
                    <i class="fa fa-copy copy-btn" title="Copiar cor!"></i>
                </div>
            </div>
            <!--COLOR BOX 4-->
            <div class="color-box">
                <div class="color" style="background-color: #b5f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#b5f5fe</span>
                    <i class="fa fa-copy copy-btn" title="Copiar cor!"></i>
                </div>
            </div>
            <!--COLOR BOX 5-->
            <div class="color-box">
                <div class="color" style="background-color: #e1f3a1;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f3a1</span>
                    <i class="fa fa-copy copy-btn" title="Copiar cor!"></i>
                </div>
            </div>
        </div>    
    </div>


    <script src="script.js"></script>
</body>
</html>
